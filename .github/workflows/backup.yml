name: Nightly database backup

# Encrypted pg_dump of the Rentora database, kept as a private workflow artifact for 30 days.
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   RENTORA_DB_URL     the Supabase "Session pooler" connection string (with password)
#   BACKUP_PASSPHRASE  a long random passphrase; keep a copy offline, it is needed to restore
on:
  schedule:
    - cron: '17 20 * * *'   # 02:17 Dhaka time
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Check secrets
        env: { DB: '${{ secrets.RENTORA_DB_URL }}', PASS: '${{ secrets.BACKUP_PASSPHRASE }}' }
        run: test -n "$DB" && test -n "$PASS" || { echo "Backup secrets are not set yet."; exit 1; }
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
      - name: Dump and encrypt
        env: { DB: '${{ secrets.RENTORA_DB_URL }}', PASS: '${{ secrets.BACKUP_PASSPHRASE }}' }
        run: |
          set -o pipefail
          f=rentora-$(date -u +%Y%m%d-%H%M).sql.gz.gpg
          /usr/lib/postgresql/17/bin/pg_dump "$DB" --schema=public --no-owner --no-privileges \
            | gzip -9 | gpg --batch --yes --symmetric --cipher-algo AES256 --passphrase "$PASS" -o "$f"
          ls -lh "$f"; echo "FILE=$f" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.FILE }}
          path: ${{ env.FILE }}
          retention-days: 30
